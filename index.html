<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yumi's 瞬発スピーキング</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
body{max-width:760px;margin:auto;padding:18px;background:#fafafa;color:#222}
.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #0001}
h1{font-size:25px;margin:5px 0}.muted{color:#777}.jp{font-size:21px;font-weight:700;margin:18px 0}
button,select{border:0;border-radius:12px;padding:11px 15px;font-size:16px;margin:4px}
button{background:#222;color:#fff;cursor:pointer}.secondary{background:#eee;color:#222}.danger{background:#963b3b}
#timer{font-size:48px;font-weight:800;text-align:center;margin:12px}
#transcript{min-height:72px;border:1px solid #ddd;border-radius:12px;padding:12px;background:#fcfcfc}
textarea{width:100%;box-sizing:border-box;min-height:80px;border:1px solid #ddd;border-radius:12px;padding:10px;font-size:16px}
.qnav span{display:inline-block;padding:5px 9px;border-radius:9px;background:#eee;margin:3px}.qnav .now{background:#222;color:#fff}
pre{white-space:pre-wrap;font-family:inherit}
</style>
</head>
<body>
<h1>🎙️ Yumi's 瞬発スピーキング</h1>
<p class="muted">事実＋自分の気持ち｜30秒 × 5問</p>

<div class="card">
<label>Day：
<select id="daySelect"></select>
</label>
<div class="qnav" id="qnav"></div>
<div class="jp" id="prompt"></div>
<div id="timer">30</div>
<div style="text-align:center">
<button id="start">🎙️ 話し始める</button>
<button id="stop" class="secondary" disabled>停止</button>
</div>
<p class="muted">音声認識結果</p>
<div id="transcript">まだありません</div>
<p><b>実際に自分が言った英語</b> <span class="muted">（認識ミスだけ直してOK）</span></p>
<textarea id="manual" placeholder="STTが『Ahaana Ayana duo』化したらここを救済😂"></textarea>
<div style="text-align:center"><button id="save">この問題を保存 →</button></div>
</div>

<div class="card">
<h2>今日の結果</h2>
<div id="result" class="muted">5問終わると、チャッピーに貼れる形式で表示します。</div>
<button id="copy" class="secondary">結果をコピー</button>
</div>

<div class="card">
<h2>📚 履歴</h2>
<div id="history" class="muted">まだありません。</div>
<button id="clear" class="danger">履歴を消去</button>
</div>

<script>
const days=[
["毎日の習慣",["私は毎朝コーヒーを飲みます。","私の仕事は9時に始まります。","私は夜に英語を勉強します。","私は週に3回散歩します。","私は普段、夜遅く寝ます。"]],
["昨日したこと",["昨日、友達とランチに行きました。","昨日の夜、家で夕食を食べました。","昨日、スーパーへ買い物に行きました。","昨日、30分英語を勉強しました。","昨日は少し疲れていました。"]],
["週末にしたこと",["週末にカフェへ行きました。","週末に家族と買い物をしました。","週末に新しい料理を作りました。","週末に英語を勉強しました。","週末は家でゆっくりしました。"]],
["最近の生活",["今日は少し疲れています。","今週は仕事が忙しいです。","最近、新しい英語表現を勉強しています。","最近、いつもより早く起きています。","今日は天気がとてもいいです。"]],
["これからの予定",["今週末は家で過ごす予定です。","近いうちに友達に会う予定です。","明日は英語を勉強するつもりです。","次の休みに買い物へ行きたいです。","来年、旅行へ行く予定です。"]],
["英語学習",["私は英語を勉強しています。","最近、英語のスピーキングを練習しています。","リスニングは少し難しいです。","毎日少しずつ英語に触れています。","もっと自然に英語を話せるようになりたいです。"]],
["Final Check",["最近、英語を話す練習を続けています。","以前より英語が聞き取れることがあります。","まだ言いたいことがすぐ出ないことがあります。","英語の勉強は楽しいです。","これからも英語の練習を続けたいです。"]]
];

let day=3,q=0,answers=Array(5).fill(null),rec=null,timer=null,left=30,lastOutput="";
const $=x=>document.getElementById(x);
days.forEach((d,i)=>$("daySelect").innerHTML+=`<option value="${i}">Day ${i+1}｜${d[0]}</option>`);
$("daySelect").value=day;

function render(){
 $("prompt").textContent=days[day][1][q];
 $("qnav").innerHTML=answers.map((a,i)=>`<span class="${i===q?'now':''}">${i+1}${a?' ✓':''}</span>`).join("");
 $("timer").textContent=left;
 $("transcript").textContent=answers[q]?.stt||"まだありません";
 $("manual").value=answers[q]?.manual||"";
}
function stop(){
 clearInterval(timer);timer=null;
 if(rec){try{rec.stop()}catch(e){}}
 $("start").disabled=false;$("stop").disabled=true;
}
function start(){
 stop();left=30;answers[q]={stt:"",manual:""};render();
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){$("transcript").textContent="⚠️ このブラウザではWeb Speech APIが使えません。";return}
 rec=new SR();rec.lang="en-US";rec.continuous=true;rec.interimResults=true;
 let finalText="";
 rec.onresult=e=>{
  let interim="";
  for(let i=e.resultIndex;i<e.results.length;i++){
   let t=e.results[i][0].transcript;
   if(e.results[i].isFinal) finalText+=t+" "; else interim+=t;
  }
  answers[q].stt=(finalText+interim).trim();
  $("transcript").textContent=answers[q].stt||"聞き取り中…";
 };
 rec.onerror=e=>{$("transcript").textContent="⚠️ 音声認識エラー："+e.error};
 try{rec.start()}catch(e){}
 $("start").disabled=true;$("stop").disabled=false;
 timer=setInterval(()=>{left--; $("timer").textContent=left;if(left<=0)stop()},1000);
}
$("start").onclick=start;$("stop").onclick=stop;
$("daySelect").onchange=e=>{stop();day=+e.target.value;q=0;answers=Array(5).fill(null);left=30;render()};
$("save").onclick=()=>{
 stop();
 let a=answers[q]||{stt:"",manual:""};
 a.manual=$("manual").value.trim();answers[q]=a;
 if(q<4){q++;left=30;render()}else finish();
};
function finish(){
 let lines=answers.map((a,i)=>`■ 問題${i+1}\n日本語：${days[day][1][i]}\n文字起こし：${a?.manual||a?.stt||"(回答なし)"}`).join("\n\n");
 lastOutput=`DAY ${day+1}：${days[day][0]}\n\n${lines}`;
 $("result").innerHTML=`<pre>${lastOutput.replaceAll("&","&amp;").replaceAll("<","&lt;")}</pre>`;
 let h=JSON.parse(localStorage.getItem("yumiSpeechHistory")||"[]");
 h.unshift({date:new Date().toLocaleString("ja-JP"),day:day+1,title:days[day][0],output:lastOutput});
 localStorage.setItem("yumiSpeechHistory",JSON.stringify(h.slice(0,30)));history();
}
$("copy").onclick=async()=>{if(lastOutput){await navigator.clipboard.writeText(lastOutput);$("copy").textContent="コピーしました ✓";setTimeout(()=>$("copy").textContent="結果をコピー",1500)}};
function history(){
 let h=JSON.parse(localStorage.getItem("yumiSpeechHistory")||"[]");
 $("history").innerHTML=h.length?h.slice(0,10).map(x=>`<div style="padding:8px 0;border-bottom:1px solid #eee"><b>${x.date}</b>　Day ${x.day}｜${x.title}</div>`).join(""):"まだありません。";
}
$("clear").onclick=()=>{if(confirm("履歴を消去しますか？")){localStorage.removeItem("yumiSpeechHistory");history()}};
render();history();
</script>
</body>
</html>
